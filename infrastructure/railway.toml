[build]
builder = "nixpacks"

[build.env]
PYTHON_VERSION = "3.11"

[deploy]
startCommand = "python -m uvicorn infrastructure.app:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 10

[[services]]
name = "TORQ API Gateway"
type = "web"

[services.env]
PORT = "8000"
PYTHONUNBUFFERED = "1"

[services.env.production]
ENVIRONMENT = "production"
LOG_LEVEL = "info"
